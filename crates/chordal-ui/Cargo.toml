[package]
name = "chordal-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Chordial 2.0 desktop UI (gpui)"

[[bin]]
name = "chordial"
path = "src/main.rs"

[dependencies]
chordal-cache = { workspace = true }
chordal-core = { workspace = true }
chordal-local = { workspace = true }
chordal-netease = { workspace = true }
chordal-player = { workspace = true }
chordial-amll-gpui = { workspace = true }
reqwest = { workspace = true }
lofty = { workspace = true }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
gpui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures = { workspace = true }
unicode-segmentation = { workspace = true }
dirs = { workspace = true }

# 崩溃兜底：Unix 安装致命信号处理，Windows 安装 unhandled exception filter。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_UI_WindowsAndMessaging",
] }
